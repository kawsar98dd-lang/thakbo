name: THAKBO Generate lockfile

# One-time helper for owners without a computer.
# Open Actions → "THAKBO Generate lockfile" → Run workflow. It creates package-lock.json on GitHub's server
# and saves it into the repository. Afterwards run "THAKBO CI" again (it will then use `npm ci`).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Same exact npm as THAKBO CI (npm 10.9 crashes on this dependency tree; see README "Dependency notes").
      - name: Install npm 11 (exact version)
        run: npm install -g npm@11.19.1
      - name: Create package-lock.json (resolves all dependencies on GitHub's server)
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Check the lockfile is installable and in sync
        run: npm ci --dry-run --no-audit --no-fund
      - name: Save lockfile to the repository
        run: |
          if git diff --quiet -- package-lock.json && [ -f package-lock.json ] && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add package-lock.json generated by GitHub Actions"
          git push
